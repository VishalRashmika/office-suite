name: Release Plugin

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      force:
        description: "Force recreate or update release even if it already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Only run if:
    # 1. Triggered manually via workflow_dispatch
    # 2. Triggered by a direct tag push
    # 3. Triggered by a Pull Request that was actually MERGED into main (not just closed)
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Extract version and check release status
        id: release_check
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Manifest version: $VERSION"

          # Check if release tag already exists on GitHub
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$VERSION")

          echo "GitHub Release API status for $VERSION: $HTTP_CODE"

          IS_TAG="${{ startsWith(github.ref, 'refs/tags/') }}"
          IS_FORCE="${{ github.event.inputs.force == 'true' }}"

          if [ "$HTTP_CODE" = "404" ] || [ "$IS_TAG" = "true" ] || [ "$IS_FORCE" = "true" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "Will proceed to build and release version $VERSION"
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Release $VERSION already exists. Skipping to avoid duplicate errors."
          fi

      - name: Install dependencies
        if: steps.release_check.outputs.should_release == 'true'
        run: npm ci

      - name: Build plugin
        if: steps.release_check.outputs.should_release == 'true'
        run: npm run build

      - name: Verify release assets
        if: steps.release_check.outputs.should_release == 'true'
        run: |
          for f in main.js manifest.json styles.css; do
            if [ ! -f "$f" ]; then
              echo "Error: Required asset $f not found!"
              exit 1
            fi
          done
          echo "All 3 required release assets (main.js, manifest.json, styles.css) are verified."

      - name: Generate artifact attestations
        if: steps.release_check.outputs.should_release == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub Release
        if: steps.release_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_check.outputs.version }}
          name: ${{ steps.release_check.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
